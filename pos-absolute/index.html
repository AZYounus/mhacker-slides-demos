<!DOCTYPE html>
<html>
    <head>
        <style>
            .group4 {
                position: relative;
                top: 20px;
                left: 50px;
                width: 300px;
                height: 160px;
                border: 5px solid yellow;
            }
            .group5 {
                position: absolute;
                top: 140px;
                right: 0px;
                width: 240px;
                height: 100px;
                border: 5px solid violet;
            }
        </style>
    </head>
    <body>
        <div class="group4">
            this is the relative parent!
            <div class="group5">
                this is an absolute element!
            </div>
        </div>
    </body>
</html>
